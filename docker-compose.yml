version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testforge-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - ENVIRONMENT=production
    volumes:
      - ./reports:/app/reports
      - ./test_data:/app/test_data
    restart: unless-stopped
    networks:
      - testforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - testforge-network

networks:
  testforge-network:
    driver: bridge
